name: Publish
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact release tag to publish
        required: true
        default: v0.2.0
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.release_ref || github.ref_name }}
        run: node -e "if(process.env.RELEASE_TAG !== 'v'+require('./package.json').version) throw new Error('Release tag and package version differ')"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm publish --provenance --access public --ignore-scripts
